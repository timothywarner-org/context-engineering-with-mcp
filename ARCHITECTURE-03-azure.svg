<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="title desc">
<title id="title">One gateway. One container. Three MCP endpoints.</title><desc id="desc">A host MCP client sends HTTPS requests with a subscription key to Azure API Management. Discovery routes to catalog, incident calls to incidents, and rate-limited runbook calls to runbooks, all inside one Container Apps container. APIM denies rollback with 403 and forwards an independent backend credential. Direct backend calls without that credential return 401. Rate limiting is approximate.</desc>
