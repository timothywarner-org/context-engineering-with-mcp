<text x="64" y="53" font-family="sans-serif" fill="#B6D7FF" font-size="24" font-weight="700" text-anchor="start">CONTEXT ENGINEERING WITH MCP   /   03</text>
<text x="64" y="115" font-family="sans-serif" fill="white" font-size="50" font-weight="700" text-anchor="start">One gateway. One container. Three MCP endpoints.</text>
<text x="64" y="159" font-family="sans-serif" fill="#E1ECFA" font-size="27" font-weight="400" text-anchor="start">The Azure supplement routes real requests and returns evidence of the endpoint that executed each tool.</text>
