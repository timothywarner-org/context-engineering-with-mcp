name: Verify course demos

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-and-memory:
    name: Protocol and memory (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Verify learner documentation and public boundaries
        run: |
          # Learner checks require only the public checkout.
          python scripts/Test-CourseHome.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install locked Python dependencies
        run: |
          uv sync --project ./python --locked --python 3.12
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Install and build locked TypeScript starter
        working-directory: typescript
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify both protocol implementations
        run: |
          uv run --project ./python python ./verify_protocol.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify memory across processes
        run: |
          uv run --project ./python python ./memory/memory_demo.py demo
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify restart and retry safety
        run: |
          # Exercise occupied ports, concurrent runs, interrupted children, and memory retries.
          uv run --locked --project ./python python ./azure-demo/test_restartability.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          uv run --locked --project ./python python ./scripts/Test-RetrySafety.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify the classroom HTTP server locally
        run: |
          # Cloud access is unnecessary for testing endpoint routing and backend authentication.
          uv run --locked --project ./python python ./azure-demo/verify_demo.py --local
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify the SDK client from another working directory
        run: |
          $clientProject = Join-Path $PWD.Path 'python'
          $clientScript = Join-Path $clientProject 'client.py'
          # GUI hosts and learner terminals may start outside the checkout.
          Push-Location ([System.IO.Path]::GetTempPath())
          try {
            $clientOutput = uv run --project $clientProject python $clientScript | Out-String
            if ($LASTEXITCODE) { throw 'SDK client failed' }
          } finally { Pop-Location }
          Write-Output $clientOutput
          foreach ($expected in @('Protocol: 2026-07-28', 'Tools: get_incident', 'Priya Patel', 'Timeouts after a deployment', 'request approval before rollback', 'is_error=True', 'Error executing tool get_incident')) {
            if (-not $clientOutput.Contains($expected)) { throw "SDK client output missing: $expected" }
          }
      - name: Generate portable client snippets
        run: |
          ./clients/New-ClientConfigs.ps1
          $inspector = Get-Content clients/generated/inspector.json -Raw | ConvertFrom-Json
          if ($inspector.mcpServers.'warnerco-incidents'.protocolEra -ne 'modern') {
            throw 'Inspector must select the modern protocol without a CLI override.'
          }
          foreach ($file in @('claude-code.mcp.json', 'claude-desktop.json')) {
            $hostConfig = Get-Content "clients/generated/$file" -Raw | ConvertFrom-Json
            if ($hostConfig.mcpServers.'warnerco-incidents'.PSObject.Properties.Name -contains 'protocolEra') {
              throw 'Inspector-specific settings leaked into a host configuration.'
            }
          }
      - name: Verify pinned Inspector tool and resource calls
        run: |
          # Exercise the same saved configuration used by the graphical Inspector.
          $inspectorConnection = npx --yes @modelcontextprotocol/inspector@2.9.0 --cli --config clients/generated/inspector.json --server warnerco-incidents --method initialize --format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $inspectorConnection.result.protocolVersion -ne '2026-07-28') {
            throw 'The generated Inspector configuration negotiated the wrong protocol.'
          }
          $inspectorToolOutput = npx --yes @modelcontextprotocol/inspector@2.9.0 --cli --config clients/generated/inspector.json --server warnerco-incidents --method tools/call --tool-name get_incident --tool-arg incident_id=INC-1042 --format json | Out-String
          if ($LASTEXITCODE -ne 0 -or $inspectorToolOutput -notmatch 'Priya Patel') { throw 'Inspector tool result failed verification' }
          Write-Output $inspectorToolOutput
          $inspectorResourceOutput = npx --yes @modelcontextprotocol/inspector@2.9.0 --cli --config clients/generated/inspector.json --server warnerco-incidents --method resources/read --uri warnerco://runbooks/order-api --format json | Out-String
          if ($LASTEXITCODE -ne 0 -or $inspectorResourceOutput -notmatch 'request approval before rollback') { throw 'Inspector resource result failed verification' }
          Write-Output $inspectorResourceOutput
      - name: Retain protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-evidence-${{ matrix.os }}
          path: protocol-evidence.json
          if-no-files-found: warn
