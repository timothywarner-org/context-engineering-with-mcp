<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="title desc">
<title id="title">MCP connects capabilities. The host builds context.</title><desc id="desc">A host contains a model, context assembly, and two distinct MCP clients. Client A communicates with the incident server; client B communicates with the memory server backed by a local JSON file. The host chooses context and permissions.</desc>
<defs><marker id="arrow-1467D2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#1467D2"/></marker><marker id="back-1467D2" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 Z" fill="#1467D2"/></marker><marker id="arrow-7047B8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#7047B8"/></marker><marker id="back-7047B8" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 Z" fill="#7047B8"/></marker><marker id="arrow-A85D0C" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#A85D0C"/></marker><marker id="back-A85D0C" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 Z" fill="#A85D0C"/></marker><marker id="arrow-455871" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#455871"/></marker><marker id="back-455871" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 Z" fill="#455871"/></marker></defs><g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F8FC" stroke="#F5F8FC" stroke-width="2"/>
<rect x="0" y="0" width="1920" height="182" rx="0" fill="#122844" stroke="#122844" stroke-width="2"/>
<text x="64" y="53" font-family="sans-serif" fill="#B6D7FF" font-size="24" font-weight="700" text-anchor="start">CONTEXT ENGINEERING WITH MCP   /   01</text>
<text x="64" y="115" font-family="sans-serif" fill="white" font-size="50" font-weight="700" text-anchor="start">MCP connects capabilities. The host builds context.</text>
<text x="64" y="159" font-family="sans-serif" fill="#E1ECFA" font-size="27" font-weight="400" text-anchor="start">The course uses local stdio servers. Remote servers can use HTTP; the responsibilities stay distinct.</text>
<rect x="64" y="220" width="800" height="720" rx="28" fill="#EAF2FF" stroke="#8FB6EE" stroke-width="2"/><text x="104" y="276" font-family="sans-serif" fill="#1467D2" font-size="25" font-weight="700" text-anchor="start">HOST APPLICATION</text><text x="104" y="321" font-family="sans-serif" fill="#172840" font-size="33" font-weight="700" text-anchor="start">Copilot, Claude, or your application</text><rect x="104" y="365" width="420" height="145" rx="22" fill="white" stroke="#CCD7E5" stroke-width="2"/><text x="132" y="414" font-family="sans-serif" fill="#172840" font-size="36" font-weight="700" text-anchor="start">Model</text><text x="132" y="457" font-family="sans-serif" fill="#455871" font-size="25" font-weight="400" text-anchor="start">Receives selected context</text><text x="132" y="490" font-family="sans-serif" fill="#455871" font-size="25" font-weight="400" text-anchor="start">Returns an answer or tool call</text><rect x="104" y="590" width="420" height="235" rx="22" fill="white" stroke="#1467D2" stroke-width="2"/><text x="132" y="637" font-family="sans-serif" fill="#1467D2" font-size="34" font-weight="700" text-anchor="start">Context assembly</text><text x="132" y="686" font-family="sans-serif" fill="#172840" font-size="28" font-weight="400" text-anchor="start">User goal + instructions</text><text x="132" y="730" font-family="sans-serif" fill="#172840" font-size="28" font-weight="400" text-anchor="start">Selected results + evidence</text><text x="132" y="774" font-family="sans-serif" fill="#172840" font-size="28" font-weight="400" text-anchor="start">Permissions + consent</text><polyline points="314,590 314,510" fill="none" stroke="#1467D2" stroke-width="4" stroke-linejoin="round"/><polygon points="314.0,510.0 307.0,525.0 321.0,525.0" fill="#1467D2"/><polygon points="314.0,590.0 321.0,575.0 307.0,575.0" fill="#1467D2"/><text x="336" y="559" font-family="sans-serif" fill="#455871" font-size="24" font-weight="400" text-anchor="start">Host controls this</text><rect x="584" y="376" width="240" height="112" rx="22" fill="white" stroke="#1467D2" stroke-width="2"/><text x="704" y="422" font-family="sans-serif" fill="#172840" font-size="26" font-weight="700" text-anchor="middle">MCP client A</text><text x="704" y="459" font-family="sans-serif" fill="#172840" font-size="26" font-weight="700" text-anchor="middle">Incidents</text><rect x="584" y="652" width="240" height="112" rx="22" fill="white" stroke="#7047B8" stroke-width="2"/><text x="704" y="698" font-family="sans-serif" fill="#172840" font-size="26" font-weight="700" text-anchor="middle">MCP client B</text><text x="704" y="735" font-family="sans-serif" fill="#172840" font-size="26" font-weight="700" text-anchor="middle">Memory</text><polyline points="524,660 550,660 550,432 584,432" fill="none" stroke="#1467D2" stroke-width="4" stroke-linejoin="round"/><polygon points="584.0,432.0 569.0,425.0 569.0,439.0" fill="#1467D2"/><polyline points="524,710 584,710" fill="none" stroke="#7047B8" stroke-width="4" stroke-linejoin="round"/><polygon points="584.0,710.0 569.0,703.0 569.0,717.0" fill="#7047B8"/><text x="104" y="897" font-family="sans-serif" fill="#172840" font-size="29" font-weight="700" text-anchor="start">Each client connects to one server.</text><polyline points="824,432 1110,432" fill="none" stroke="#1467D2" stroke-width="4" stroke-linejoin="round"/><polygon points="1110.0,432.0 1095.0,425.0 1095.0,439.0" fill="#1467D2"/><polygon points="824.0,432.0 839.0,439.0 839.0,425.0" fill="#1467D2"/><text x="967" y="403" font-family="sans-serif" fill="#1467D2" font-size="25" font-weight="700" text-anchor="middle">stdio / JSON-RPC</text><polyline points="824,708 1110,708" fill="none" stroke="#7047B8" stroke-width="4" stroke-linejoin="round"/><polygon points="1110.0,708.0 1095.0,701.0 1095.0,715.0" fill="#7047B8"/><polygon points="824.0,708.0 839.0,715.0 839.0,701.0" fill="#7047B8"/><text x="967" y="680" font-family="sans-serif" fill="#7047B8" font-size="25" font-weight="700" text-anchor="middle">stdio / JSON-RPC</text><rect x="1110" y="240" width="746" height="338" rx="26" fill="white" stroke="#1467D2" stroke-width="3"/><text x="1146" y="292" font-family="sans-serif" fill="#1467D2" font-size="36" font-weight="700" text-anchor="start">Incident MCP server</text><text x="1146" y="334" font-family="sans-serif" fill="#455871" font-size="26" font-weight="400" text-anchor="start">Python starter or TypeScript alternative</text><text x="1146" y="392" font-family="sans-serif" fill="#172840" font-size="29" font-weight="400" text-anchor="start">TOOL       get_incident(INC-1042)</text><text x="1146" y="455" font-family="sans-serif" fill="#172840" font-size="29" font-weight="400" text-anchor="start">RESOURCE   Order API runbook</text><text x="1146" y="518" font-family="sans-serif" fill="#172840" font-size="29" font-weight="400" text-anchor="start">PROMPT     investigate_incident</text><rect x="1110" y="625" width="746" height="205" rx="26" fill="white" stroke="#7047B8" stroke-width="3"/><text x="1146" y="675" font-family="sans-serif" fill="#7047B8" font-size="36" font-weight="700" text-anchor="start">Memory MCP server</text><text x="1146" y="726" font-family="sans-serif" fill="#172840" font-size="29" font-weight="400" text-anchor="start">memory_write  /  memory_search</text><text x="1146" y="771" font-family="sans-serif" fill="#172840" font-size="29" font-weight="400" text-anchor="start">memory_compress</text><polyline points="1483,830 1483,874" fill="none" stroke="#7047B8" stroke-width="4" stroke-linejoin="round"/><polygon points="1483.0,874.0 1490.0,859.0 1476.0,859.0" fill="#7047B8"/><polygon points="1483.0,830.0 1476.0,845.0 1490.0,845.0" fill="#7047B8"/><rect x="1250" y="874" width="466" height="66" rx="14" fill="#F1EAFE" stroke="#BBA2E0" stroke-width="2"/><text x="1483" y="917" font-family="sans-serif" fill="#7047B8" font-size="29" font-weight="700" text-anchor="middle">Durable local JSON file</text>
