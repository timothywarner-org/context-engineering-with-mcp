<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="title desc">
<title id="title">Memory survives a process. Context must be rebuilt.</title><desc id="desc">Process A retrieves incident evidence and saves a decision via memory_write to a durable JSON file. After A exits, process B searches and compresses from the same file, then the host includes that result in a new model request. Compression selects and truncates; it is not an LLM summary.</desc>
<defs><marker id="arrow-1467D2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#1467D2"/></marker><marker id="back-1467D2" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 Z" fill="#1467D2"/></marker><marker id="arrow-7047B8" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#7047B8"/></marker><marker id="back-7047B8" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 Z" fill="#7047B8"/></marker><marker id="arrow-A85D0C" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#A85D0C"/></marker><marker id="back-A85D0C" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 Z" fill="#A85D0C"/></marker><marker id="arrow-455871" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#455871"/></marker><marker id="back-455871" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 Z" fill="#455871"/></marker></defs><g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1920" height="1080" rx="0" fill="#F5F8FC" stroke="#F5F8FC" stroke-width="2"/>
<rect x="0" y="0" width="1920" height="182" rx="0" fill="#122844" stroke="#122844" stroke-width="2"/>
<text x="64" y="53" font-family="sans-serif" fill="#B6D7FF" font-size="24" font-weight="700" text-anchor="start">CONTEXT ENGINEERING WITH MCP   /   02</text>
<text x="64" y="115" font-family="sans-serif" fill="white" font-size="50" font-weight="700" text-anchor="start">Memory survives a process. Context must be rebuilt.</text>
<text x="64" y="159" font-family="sans-serif" fill="#E1ECFA" font-size="27" font-weight="400" text-anchor="start">The scripted demo proves persistence and retrieval. A fresh host conversation completes model-facing reuse.</text>
<rect x="64" y="232" width="760" height="488" rx="26" fill="#EAF2FF" stroke="#8FB6EE" stroke-width="2"/><text x="100" y="284" font-family="sans-serif" fill="#1467D2" font-size="27" font-weight="700" text-anchor="start">PROCESS A  /  CAPTURE</text><rect x="100" y="316" width="688" height="138" rx="22" fill="white" stroke="#CCD7E5" stroke-width="2"/><text x="130" y="363" font-family="sans-serif" fill="#172840" font-size="32" font-weight="700" text-anchor="start">Retrieve incident facts + runbook</text><text x="130" y="405" font-family="sans-serif" fill="#172840" font-size="29" font-weight="400" text-anchor="start">INC-1042  ·  Order API  ·  Priya Patel</text><polyline points="444,454 444,486" fill="none" stroke="#1467D2" stroke-width="4" stroke-linejoin="round"/><polygon points="444.0,486.0 451.0,471.0 437.0,471.0" fill="#1467D2"/><rect x="100" y="486" width="688" height="190" rx="22" fill="white" stroke="#1467D2" stroke-width="2"/><text x="130" y="535" font-family="sans-serif" fill="#1467D2" font-size="33" font-weight="700" text-anchor="start">memory_write</text><text x="130" y="582" font-family="sans-serif" fill="#172840" font-size="30" font-weight="400" text-anchor="start">Save a useful decision with tags.</text><text x="130" y="627" font-family="sans-serif" fill="#172840" font-size="30" font-weight="400" text-anchor="start">Keep the approval requirement.</text><rect x="1096" y="232" width="760" height="488" rx="26" fill="#F1EAFE" stroke="#BBA2E0" stroke-width="2"/><text x="1132" y="284" font-family="sans-serif" fill="#7047B8" font-size="27" font-weight="700" text-anchor="start">PROCESS B  /  REUSE</text><rect x="1132" y="316" width="688" height="138" rx="22" fill="white" stroke="#CCD7E5" stroke-width="2"/><text x="1162" y="363" font-family="sans-serif" fill="#7047B8" font-size="32" font-weight="700" text-anchor="start">memory_search + memory_compress</text><text x="1162" y="411" font-family="sans-serif" fill="#172840" font-size="29" font-weight="400" text-anchor="start">Rank matches. Select and truncate.</text><polyline points="1476,454 1476,486" fill="none" stroke="#7047B8" stroke-width="4" stroke-linejoin="round"/><polygon points="1476.0,486.0 1483.0,471.0 1469.0,471.0" fill="#7047B8"/><rect x="1132" y="486" width="688" height="190" rx="22" fill="white" stroke="#7047B8" stroke-width="2"/><text x="1162" y="535" font-family="sans-serif" fill="#172840" font-size="32" font-weight="700" text-anchor="start">Assemble the next model request</text><text x="1162" y="582" font-family="sans-serif" fill="#172840" font-size="29" font-weight="400" text-anchor="start">The host explicitly includes the result.</text><text x="1162" y="627" font-family="sans-serif" fill="#172840" font-size="29" font-weight="400" text-anchor="start">Review sources, dates and caveats.</text><line x1="960" y1="235" x2="960" y2="705" stroke="#AAB8CA" stroke-width="3" stroke-dasharray="10 10"/><rect x="844" y="404" width="232" height="147" rx="14" fill="#F5F8FC" stroke="#F5F8FC" stroke-width="2"/><text x="960" y="446" font-family="sans-serif" fill="#172840" font-size="25" font-weight="700" text-anchor="middle">A exits.</text><text x="960" y="485" font-family="sans-serif" fill="#172840" font-size="25" font-weight="700" text-anchor="middle">B starts fresh.</text><text x="960" y="524" font-family="sans-serif" fill="#172840" font-size="25" font-weight="700" text-anchor="middle">The file survives.</text><rect x="690" y="784" width="540" height="152" rx="24" fill="white" stroke="#7047B8" stroke-width="3"/><text x="960" y="830" font-family="sans-serif" fill="#7047B8" font-size="27" font-weight="700" text-anchor="middle">DURABLE JSON STORE</text><text x="960" y="873" font-family="sans-serif" fill="#172840" font-size="26" font-weight="400" text-anchor="middle">Same absolute path in both processes</text><text x="960" y="910" font-family="sans-serif" fill="#172840" font-size="26" font-weight="400" text-anchor="middle">Separate from chat history</text><polyline points="444,720 444,860 690,860" fill="none" stroke="#1467D2" stroke-width="4" stroke-linejoin="round"/><polygon points="690.0,860.0 675.0,853.0 675.0,867.0" fill="#1467D2"/><text x="478" y="827" font-family="sans-serif" fill="#1467D2" font-size="27" font-weight="700" text-anchor="start">1  WRITE</text><polyline points="1230,860 1476,860 1476,720" fill="none" stroke="#7047B8" stroke-width="4" stroke-linejoin="round"/><polygon points="1476.0,720.0 1469.0,735.0 1483.0,735.0" fill="#7047B8"/><text x="1263" y="827" font-family="sans-serif" fill="#7047B8" font-size="27" font-weight="700" text-anchor="start">2  RETRIEVE</text>
<rect x="64" y="980" width="1792" height="64" rx="16" fill="#E6EEF9" stroke="#E6EEF9" stroke-width="2"/>
<text x="960" y="1022" font-family="sans-serif" fill="#172840" font-size="29" font-weight="700" text-anchor="middle">Storage persists. Retrieval selects. The host decides what the model sees.</text>
</g></svg>